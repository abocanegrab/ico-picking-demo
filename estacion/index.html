    <script>
      ;(function () {
        var l = window.location
        if (l.search.charAt(1) !== "/") return
        var ruta = l.search
          .slice(1)
          .split("&")
          .map(function (parte) {
            return parte.replace(/~and~/g, "&")
          })
          .join("?")
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + ruta + l.hash)
      })()
    </script>
